name: Build & Auto-Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional English release notes"
        required: false
        default: ""
      mandatory:
        description: "Mark update as mandatory (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$SDK_ROOT/licenses"
          grep -qxF "24333f8a63b6825ea9c5514f83c2829b004d1fee" "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$SDK_ROOT/licenses/android-sdk-license"
          grep -qxF "d56f5187479451eabf01fb78af6dfcb131a6481e" "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$SDK_ROOT/licenses/android-sdk-license"
          for sm in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$sm" ]; then
              yes | "$sm" --licenses >/dev/null 2>&1 || true
            fi
          done

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare .env & Restore Firebase / Signing Configs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing! Add GitHub Secret GOOGLE_SERVICES_JSON in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > "$GITHUB_WORKSPACE/debug.keystore"
          fi

      - name: Compute auto-incrementing versionCode & versionName
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN_NUM: ${{ github.run_number }}
        run: |
          BASE_CODE=$(grep -E "versionCode\s*=" app/build.gradle.kts | head -n1 | tr -dc '0-9')
          BASE_CODE=${BASE_CODE:-2}

          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""' 2>/dev/null || echo "")
          PREV_CODE=$(echo "$LATEST_TAG" | grep -oE 'b[0-9]+$' | tr -dc '0-9' || echo "0")
          PREV_CODE=${PREV_CODE:-0}

          CANDIDATE_CODE=$((BASE_CODE + BASE_RUN_NUM))
          if [ "$PREV_CODE" -ge "$CANDIDATE_CODE" ]; then
            NEW_CODE=$((PREV_CODE + 1))
          else
            NEW_CODE=$CANDIDATE_CODE
          fi
          NEW_NAME="1.1.${BASE_RUN_NUM}"
          TAG="v${NEW_NAME}-b${NEW_CODE}"

          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = ${NEW_CODE}/" app/build.gradle.kts
          sed -i -E "s/versionName\s*=\s*\"[^\"]+\"/versionName = \"${NEW_NAME}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: Configure Signing & Build APK
        id: build_apk
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          gradle --version
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Building signed Release APK using UPLOAD_KEYSTORE_BASE64..."
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$GITHUB_WORKSPACE/my-upload-key.jks"
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace
            APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
              echo "WARNING: DEBUG_KEYSTORE_BASE64 secret not set; generating fallback debug.keystore..."
              keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK output not found!"
            exit 1
          fi
          cp "$APK_FILE" release-artifacts/brohi-ice-factory-latest.apk
          ls -lh release-artifacts/brohi-ice-factory-latest.apk

      - name: Generate version.json & Release Notes
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MANUAL_NOTES: ${{ inputs.release_notes }}
          MANDATORY_FLAG: ${{ inputs.mandatory }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime

          notes = (os.environ.get("MANUAL_NOTES") or "").strip()
          if not notes:
              commit_lines = (os.environ.get("COMMIT_MSG") or "").strip().splitlines()
              notes = commit_lines[0].strip() if commit_lines else "Latest Brohi Ice Factory updates and improvements."

          mandatory = (os.environ.get("MANDATORY_FLAG") or "false").strip().lower() == "true"
          vc = int(os.environ["VERSION_CODE"])
          vn = os.environ["VERSION_NAME"]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          today = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          apk_url = f"https://github.com/{repo}/releases/download/{tag}/brohi-ice-factory-latest.apk"
          payload = {
              "latestVersionCode": vc,
              "latestVersionName": vn,
              "releaseNotes": notes,
              "releaseNotesUrdu": f"نیا ورژن v{vn} (Build {vc}) GitHub سے دستیاب ہے — انسٹال کرنے کے لیے Update Now پر ٹیپ کریں۔",
              "apkDownloadUrl": apk_url,
              "mandatory": mandatory,
              "publishedBy": "GitHub Auto-Release",
              "publishedAtIso": today
          }
          with open("release-artifacts/version.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          with open("release-artifacts/release_body.md", "w", encoding="utf-8") as f:
              f.write(f"## Brohi Ice Factory v{vn} (Build {vc})\n\n")
              f.write(f"- **What's New:** {notes}\n")
              f.write(f"- **Direct APK Asset:** `brohi-ice-factory-latest.apk`\n")
              f.write(f"- **Auto-Update Metadata:** `version.json`\n")
          PY
          cat release-artifacts/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Brohi Ice Factory v${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})
          body_path: release-artifacts/release_body.md
          draft: false
          prerelease: false
          files: |
            release-artifacts/brohi-ice-factory-latest.apk
            release-artifacts/version.json
